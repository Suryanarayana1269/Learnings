<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
    <style>
        table {
            border: 5px solid green;
            border-collapse: collapse;
        }
        th, td {
            border: 2px solid rgb(128, 73, 0);
            padding: 10px;
        }
        thead {
            background-color: #f0e68c;
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th>Names</th>
                <th>Marks scored in Maths out of 100</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Sai</td>
                <td>95</td>
            </tr>
            <tr>
                <td>Rupesh</td>
                <td>85</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
